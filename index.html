<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simulación interactiva 3D del Sistema Solar con WebGPU, compute shaders y rigor astronómico."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>"
    />
    <title>Sistema Solar · WebGPU</title>
    <script type="module" crossorigin src="/solar-system-webgpu/assets/index-BAE39NuN.js"></script>
    <link rel="stylesheet" crossorigin href="/solar-system-webgpu/assets/index-C2hm7hJM.css">
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels-root"></div>
    <div id="hud-root"></div>

    <div
      id="loading"
      class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-[#04060d] text-slate-200"
    >
      <div class="relative h-16 w-16">
        <div class="absolute inset-0 animate-ping rounded-full bg-cyan-500/20"></div>
        <div
          class="absolute inset-0 animate-spin rounded-full border-2 border-slate-700 border-t-cyan-400"
        ></div>
        <div class="absolute inset-0 flex items-center justify-center text-2xl">🪐</div>
      </div>
      <p id="loading-msg" class="font-mono text-sm tracking-widest text-slate-400">
        INICIALIZANDO WEBGPU…
      </p>
      <div id="loading-fallback" class="hidden max-w-sm flex-col items-center gap-2 text-center">
        <p class="text-xs text-slate-400">Si la carga tarda demasiado (caché de versión anterior), prueba recargar.</p>
        <button
          type="button"
          onclick="location.replace(location.pathname + '?v=' + Date.now())"
          class="cursor-pointer rounded-md border border-cyan-400/60 bg-cyan-500/15 px-3 py-1.5 font-mono text-xs text-cyan-200 hover:bg-cyan-500/25"
        >
          Recargar versión más reciente
        </button>
      </div>
      <noscript>
        <p class="text-red-400">Esta simulación requiere JavaScript habilitado.</p>
      </noscript>
    </div>

    <script>
      (function () {
        function showReload() {
          var fb = document.getElementById('loading-fallback');
          if (fb && document.getElementById('loading')) {
            fb.classList.remove('hidden');
            fb.classList.add('flex');
          }
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') showReload();
        }, true);
        setTimeout(showReload, 12000);
      })();
    </script>
  </body>
</html>
